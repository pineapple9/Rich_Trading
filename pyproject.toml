[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rich-trading"
version = "0.1.0"
description = "Thai stock trading research, risk planning, and a local paper portfolio"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["rich_trading*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
cache-dir = "var/uv-cache"
